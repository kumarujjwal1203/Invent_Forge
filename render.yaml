services:
  - type: web
    name: invent-forge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: INVENTEDGE_DATABASE_URL
        value: file:inventedge.db
